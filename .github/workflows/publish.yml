name: Publish to PyPI

# Fires on a version tag (e.g. `git tag v0.2.0 && git push --tags`). Uses
# PyPI Trusted Publishing (OIDC) -- no API token stored in this repo. That
# needs a one-time, manual setup on pypi.org that only the project owner
# can do (create the `detectl` project, add this repo/workflow as a
# trusted publisher under its Publishing settings) before the first tag
# push will actually succeed; until then this workflow exists but has
# nothing to authenticate against.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # manual escape hatch, in case the tag-push trigger doesn't fire

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
