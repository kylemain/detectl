[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detectl"
version = "0.2.0"
description = "A CLI for managing detection rules, tuning lists, alerts, and ad-hoc queries across multiple SIEM/EDR platforms through one consistent interface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kyle Main" }]
keywords = ["siem", "detection-engineering", "splunk", "elastic", "sentinel", "crowdstrike", "qradar", "sumologic", "chronicle", "security", "sigmux", "sigma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Powers `detectl rules create-from-sigma` / `--dry-run`'s diff view. Kept
# optional so the core install stays dependency-light -- most detectl
# commands need neither. sigmux isn't on PyPI (yet, see its own README),
# so this pins straight to the GitHub repo.
sigma = ["sigmux @ git+https://github.com/kylemain/sigmux.git"]
dryrun = ["rich>=13.0"]

[project.scripts]
detectl = "detectl.cli:main"

[project.urls]
Homepage = "https://github.com/kylemain/detectl"
Repository = "https://github.com/kylemain/detectl"
Issues = "https://github.com/kylemain/detectl/issues"

[tool.setuptools.packages.find]
include = ["detectl*"]
